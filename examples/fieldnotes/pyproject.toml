[project]
name = "fieldnotes"
version = "0.1.0"
description = "Tenchi reference backend for cited personal research."
requires-python = ">=3.12"
dependencies = [
    "aiosqlite>=0.20",
    "tenchi[mcp,otel]",
]

[dependency-groups]
dev = [
    "httpx>=0.27",
    "openapi-spec-validator>=0.9",
    "pyright>=1.1.390",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16.5",
    "uvicorn>=0.52.1",
]

[tool.uv]
package = false

[tool.uv.sources]
tenchi = { path = "../..", editable = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "app"]
pythonpath = ["."]

[tool.pyright]
include = ["app", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.12"

[tool.ruff]
line-length = 88
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
