version: 2
updates:
  - package-ecosystem: "uv"
    directories:
      - "/"
      - "/examples/taskboard"
      - "/examples/fieldnotes"
    schedule:
      interval: "weekly"
    # Refresh tested versions without raising a compatible published lower bound.
    versioning-strategy: "increase-if-necessary"
    groups:
      runtime-dependencies:
        dependency-type: "production"
      development-dependencies:
        dependency-type: "development"
