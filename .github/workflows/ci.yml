name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Run tests
        env:
          TENCHI_AGENT_PROTOCOL_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: uv run pytest
      - name: Verify todos source, architecture, and compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run --directory examples/todos tenchi verify
          --base-ref "${BASE_SHA}"
      # The taskboard example is a standalone project consuming tenchi as
      # a path dependency; it gets its own environment and checks.
      - name: Verify taskboard source, architecture, and compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: >-
          uv run --directory examples/taskboard tenchi verify
          --base-ref "${BASE_SHA}"
