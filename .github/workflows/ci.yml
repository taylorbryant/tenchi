name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  minimum-dependencies:
    runs-on: ubuntu-latest
    env:
      UV_RESOLUTION: lowest-direct
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Resolve declared direct-dependency lower bounds
        run: uv lock --upgrade
      - run: uv sync --locked
      - name: Run tests against declared lower bounds
        run: uv run pytest

  checks:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --locked
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pyright
      - name: Run tests
        env:
          TENCHI_AGENT_PROTOCOL_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TENCHI_EVALUATION_MANIFEST_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TENCHI_JOB_MANIFEST_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          TENCHI_TOOL_MANIFEST_BASE_REF: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: uv run pytest
      - name: Verify todos source, architecture, and compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          evaluation_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/todos/evaluations.json" 2>/dev/null; then
            evaluation_args+=(--allow-missing-evaluation-baseline)
          fi
          job_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/todos/jobs.json" 2>/dev/null; then
            job_args+=(--allow-missing-job-baseline)
          fi
          uv run --directory examples/todos tenchi verify \
            --base-ref "${BASE_SHA}" "${job_args[@]}" "${evaluation_args[@]}"
      # The taskboard example is a standalone project consuming tenchi as
      # a path dependency; it gets its own environment and checks.
      - name: Verify taskboard source, architecture, and compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          evaluation_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/taskboard/evaluations.json" 2>/dev/null; then
            evaluation_args+=(--allow-missing-evaluation-baseline)
          fi
          job_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/taskboard/jobs.json" 2>/dev/null; then
            job_args+=(--allow-missing-job-baseline)
          fi
          uv run --directory examples/taskboard tenchi verify \
            --base-ref "${BASE_SHA}" "${job_args[@]}" "${evaluation_args[@]}"
      - name: Verify Fieldnotes source, architecture, and compatibility
        env:
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if ! git cat-file -e "${BASE_SHA}:examples/fieldnotes/openapi.json" 2>/dev/null || \
             ! git cat-file -e "${BASE_SHA}:examples/fieldnotes/tools.json" 2>/dev/null; then
            uv run --directory examples/fieldnotes tenchi check
            exit 0
          fi

          evaluation_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/fieldnotes/evaluations.json" 2>/dev/null; then
            evaluation_args+=(--allow-missing-evaluation-baseline)
          fi
          job_args=()
          if ! git cat-file -e "${BASE_SHA}:examples/fieldnotes/jobs.json" 2>/dev/null; then
            job_args+=(--allow-missing-job-baseline)
          fi
          uv run --directory examples/fieldnotes tenchi verify \
            --base-ref "${BASE_SHA}" "${job_args[@]}" "${evaluation_args[@]}"
